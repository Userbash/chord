# === Профили отделов специалистов (Specialist Department Profiles) ===
# Маршрутизация: Carbon строго для сложнейших P0 ядра/крипто/буфера,
# Argon — надежная рабочая лошадка для BFF/QA/RE, Flash — для UI/CSS/Docs.
# Полный запрет codex и deepseek.

# OPT-2: Наборы memory_connectors по ролям (не грузим все 13 всем профилям)
# Экономия 15-25K токенов на старт воркера
[profile_connector_sets.core_only]
# Минимум для всех воркеров
connectors = ["project_rules", "agents_governance", "process_rules", "waves_state"]

[profile_connector_sets.backend_set]
# G1 Backend: core + RE-оракул + rust-client docs
connectors = ["project_rules", "agents_governance", "process_rules", "waves_state",
              "project_context", "docs_rust_client", "docs_re"]

[profile_connector_sets.frontend_set]
# G2 Frontend: core + specs (UI токены, breakpoints)
connectors = ["project_rules", "agents_governance", "process_rules", "waves_state",
              "docs_specs"]

[profile_connector_sets.qa_set]
# G4 QA: core + test_policy + task_pool
connectors = ["project_rules", "agents_governance", "process_rules", "waves_state",
              "test_policy", "kanban_task_pool"]

[profile_connector_sets.voice_set]
# G5 Voice: core + RE + reference_projects (Serein transport.rs)
connectors = ["project_rules", "agents_governance", "process_rules", "waves_state",
              "docs_re", "reference_projects", "docs_rust_client"]

[profile_connector_sets.re_set]
# G7 RE/REA: core + RE + reference_projects + waves_rw42
connectors = ["project_rules", "agents_governance", "process_rules", "waves_state",
              "docs_re", "reference_projects", "waves_rw42_gpui"]

[profile_connector_sets.pm_set]
# PM/Tech Reviewer: все коннекторы управления проектом
connectors = ["project_rules", "agents_governance", "process_rules", "team_rules",
              "test_policy", "waves_state", "waves_rw41", "kanban_task_pool",
              "project_context", "waves_journal"]

[profile_connector_sets.devops_set]
# DevOps: core + waves + journal
connectors = ["project_rules", "agents_governance", "process_rules", "waves_state",
              "waves_rw41", "waves_journal"]

[agent_profiles.base_discord_lab]
agent = "antigravity"
model = "gemini-4-argon-high"
add_dirs = ["/home/user/orca/project/docs/reference-projects"]
# OPT-5: Общая часть вынесена в base, профили добавляют только scope-специфику
append_system_prompt = "Соблюдай AGENTS.md и TEAM.md: Strict TDD (Red→Green), работай строго в своём write-scope. Запрещено: codex, deepseek, чужие файлы."
# OPT-2: Базовый набор — только критичные коннекторы
connector_set = "core_only"

[agent_profiles.g1_backend]
inherits = "base_discord_lab"
model = "gemini-4-argon-high"
# OPT-5: только dept-специфика, общие правила уже в base
append_system_prompt = "G1 Backend. Scope: rust/crates/discord-{core,codec,media,store,i18n}, rust/gui-spike/src/*.rs (кроме voice_devices.rs), tests/*_contract.rs. T0: cargo test -p discord-media && целевой контрактный тест."
