# ecc2.toml — Конфигурация ECC 2.0 Control Plane для репозитория discord-lab
# Связывает отделы G1..G7, PM, Tech Reviewer и DevOps с приоритетным планом интеграции P0..P2
# из эталонных проектов ViceVerse-cz/Serein, japandotorg/LemonCord и rust-discord-activity.

db_path = "/home/user/orca/project/.claude/ecc2.db"
worktree_root = "/home/user/orca/workspaces/ecc-worktrees"
worktree_branch_prefix = "feature"
# Оптимизировано под AMD Ryzen 7 7800X3D (8C/16T) и 48 GB RAM (Swap: 0B):
# 4 параллельных воркера + 1 PM координатор = <= 16-18 GB RSS (при жёстком потолке 25 GB)
max_parallel_sessions = 4
max_parallel_worktrees = 4
worktree_retention_secs = 900
session_timeout_secs = 1800
heartbeat_interval_secs = 30
auto_terminate_stale_sessions = true
default_agent = "antigravity"
default_agent_profile = "pm_review"
auto_dispatch_unread_handoffs = true
auto_dispatch_limit_per_session = 4
auto_create_worktrees = false
auto_merge_ready_worktrees = false
cost_budget_usd = 25.0
token_budget = 2000000
theme = "Dark"
pane_layout = "grid"

[risk_thresholds]
review = 0.35
confirm = 0.60
block = 0.85

[budget_alert_thresholds]
# Ранние предупреждения → экономия токенов, а не постфактум
advisory = 0.20
warning = 0.40
critical = 0.60

[conflict_resolution]
enabled = true
strategy = "escalate"
notify_lead = true

# === Исполнители (Harness Runners) ===
[harness_runners.antigravity]
program = "/home/user/orca/project/scripts/ecc-orca-bridge.sh"
project_markers = [".agents", "AGENTS.md"]
cwd_flag = "--cwd"
session_name_flag = "--session-name"
task_flag = "--task"
model_flag = "--model"
add_dir_flag = "--add-dir"
append_system_prompt_flag = "--append-system-prompt"
# OPT-1: false → task spec передаётся один раз (экономия 200-600K токенов/воркер)
inline_system_prompt_for_task = false

[harness_runners.antigravity.env]
CARGO_BUILD_JOBS = "6"
CARGO_TARGET_DIR = "/home/user/orca/project/rust/target"
NODE_OPTIONS = "--max-old-space-size=1536"
WORKER_RAM_LIMIT_MB = "25600"
MAX_ACTIVE_WORKERS = "4"

[harness_runners.opencode]
program = "/home/user/orca/project/scripts/ecc-orca-bridge.sh"
project_markers = [".agents", "AGENTS.md"]
cwd_flag = "--cwd"
session_name_flag = "--session-name"
task_flag = "--task"
model_flag = "--model"
add_dir_flag = "--add-dir"
append_system_prompt_flag = "--append-system-prompt"
# OPT-1: false → task spec передаётся один раз (экономия 200-600K токенов/воркер)
inline_system_prompt_for_task = false

[harness_runners.opencode.env]
CARGO_BUILD_JOBS = "6"
CARGO_TARGET_DIR = "/home/user/orca/project/rust/target"
NODE_OPTIONS = "--max-old-space-size=1536"
WORKER_RAM_LIMIT_MB = "25600"
MAX_ACTIVE_WORKERS = "4"

