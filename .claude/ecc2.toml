connector_set = "backend_set"

[agent_profiles.g2_frontend]
inherits = "base_discord_lab"
model = "gemini-3.8-flash-high"
append_system_prompt = "G2 Frontend. Scope: rust/gui-spike/ui/**/*.{js,css,html}, tests/unit/*.test.mjs. T0: node scripts/test-impact.mjs --run && npm run typecheck."
