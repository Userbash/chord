[[orchestration_templates.p0_server_and_voice_serein_fix.steps]]
name = "task-701-voice-calls-fsm-and-dave-e2ee"
profile = "g5_voice_platform"
task_group = "G5-VOICE"
task = "Target: rust/crates/discord-voice/src/lib.rs, rust/crates/discord-voice/src/srtp.rs, rust/crates/discord-voice/tests/voice_call_state_machine_contract.rs. Change: Реализовать этапы V1, V2, V3, V4 в крейте discord-voice по эталону docs/reference-projects/sources/Serein/crates/discord-gateway/src/voice.rs и crates/discord-voice/src/transport.rs: (1) Конечный автомат звонка VoiceCallStateMachine (Idle, Signaling, NegotiatingTransport, Connected, Departing) с монотонным negotiation_revision, барьером VOICE_STATE_UPDATE + VOICE_SERVER_UPDATE, session_confirmed только после op:4 SessionDescription, коалесценцией STATE_COALESCE = 120ms для mute/deaf и 15s таймаутом с возвратом VoiceCleanupAction::SendGatewayLeaveOp4; (2) Трекер SeqAckTracker (обновление seq_ack: Option<u16> из JSON seq и 2-байтного BE заголовка бинарных DAVE-фреймов op 25/27/29/30, генерация op:3 Heartbeat и op:7 Resume); (3) Движок DAVE v1 MLS в srtp.rs (инициализация на op:4 с отправкой бинарного op:26 KeyPackage, учёт recognized_users из op:11/13, обработка бинарных op:25 ExternalSender, op:27 Proposals -> ответ бинарный op:28 CommitWelcome, op:29/30 Commit/Welcome -> ответ JSON op:23 TransitionReady или op:31 InvalidCommitWelcome + свежий op:26, обработка JSON op:21/22 переключения эпох, двойное шифрование/дешифрование DAVE + SRTP со снятием RFC 5285 0xBEDE); (4) UdpReliabilityTracker (keepalive 5s, UdpFailures = 10 ошибок подряд -> реконнект, ротация порта +60.08s); (5) Контрактный тест tests/voice_call_state_machine_contract.rs. Constraints: Строгий TDD, не менять файлы вне своего контура, для запуска cargo использовать flock /tmp/discord-lab-cargo.lock. Ownership: Только rust/crates/discord-voice/{src/lib.rs,src/srtp.rs,tests/voice_call_state_machine_contract.rs}. Observable acceptance: flock /tmp/discord-lab-cargo.lock cargo test --manifest-path rust/Cargo.toml -p discord-voice --test voice_call_state_machine_contract проходит зелено."

[[orchestration_templates.p0_server_and_voice_serein_fix.steps]]
name = "task-702-gateway-op37-and-voice-ws-v8"
