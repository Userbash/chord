[package]
name = "chord-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui = { package = "gpui-pre", version = "0.3.12" }
gpui-kit = { path = "../../gpui-kit/crates/kit" }
gpui-component = { path = "../../gpui-kit/crates/component" }
gpui-webview = { path = "../../gpui-kit/crates/webview" }

chord-core = { path = "../crates/chord-core" }
chord-codec = { path = "../crates/chord-codec" }
chord-json = { path = "../crates/chord-json" }
chord-voice = { path = "../crates/chord-voice" }
chord-media = { path = "../crates/chord-media" }
chord-platform = { path = "../crates/chord-platform" }
chord-store = { path = "../crates/chord-store" }
chord-i18n = { path = "../crates/chord-i18n" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Проверенные стандартные библиотеки для замены самописного кода
rusqlite = { version = "0.40.2", features = ["bundled"] }
cpal = "0.15.3"
aes-gcm = "0.11.1"
chacha20poly1305 = "0.11.0"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 1

[profile.test]
debug = 1


