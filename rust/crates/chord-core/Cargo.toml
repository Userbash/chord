[package]
name = "chord-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Шлюз Discord, REST v9, сессии и реконнект"

[dependencies]
chord-codec = { workspace = true }
# Production-разбор JSON-ответов REST (`GET /users/@me`): строгий парсер без serde.
chord-json = { workspace = true }
chord-voice = { path = "../chord-voice" }
rayon = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "time", "net", "macros", "signal"] }
tokio-util = "0.7"
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
httparse = { workspace = true }
webpki-roots = { workspace = true }
futures-util = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
regex = "1"
tracing-subscriber = { workspace = true }
twilight-model = { version = "0.15", default-features = false }
twilight-util = { version = "0.18", default-features = false, features = ["permission-calculator"] }

[dev-dependencies]
# Энкодер zstd: стаб-сервер в тестах строит непрерывный поток (продукт пишет несжатый ETF).
zstd = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
