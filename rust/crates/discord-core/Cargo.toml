[package]
name = "discord-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Шлюз Discord, REST v9, сессии и реконнект"

[dependencies]
discord-codec = { workspace = true }
# Production-разбор JSON-ответов REST (`GET /users/@me`): строгий парсер без serde.
discord-json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
httparse = { workspace = true }
webpki-roots = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
# Энкодер zstd: стаб-сервер в тестах строит непрерывный поток (продукт пишет несжатый ETF).
zstd = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
