[package]
name = "chord-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ETF (erlpack) и zstd-стрим кодеки протокола Discord"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Потоковый декодер zstd (libzstd, `ZSTD_decompressStream`): отдаёт распакованные байты сразу и
# держит окно/историю отдельно. ruzstd этого не умеет — до завершения кадра он удерживает
# последние window_size байт (находка F-GW-01, task-137).
zstd = { workspace = true }
