[package]
name = "chord-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Системная интеграция: tray, уведомления, нативные мосты"

[dependencies]
# SCM_RIGHTS для передачи unix-fd (RW-35); версия уже в Cargo.lock/офлайн-кэше.
libc = "0.2"
# RW51-EPIC4-T1: Cross-platform native audio I/O engine (ALSA / CoreAudio / WASAPI).
cpal = "0.15.3"
# XDG Desktop Portal (Wayland PipeWire ScreenCast) — локально закэширован 0.13.13.
ashpd = { version = "0.14", default-features = false, features = ["screencast"] }
enumflags2 = "0.7"
tokio = { workspace = true }
# Зануление секретных буферов в памяти.
zeroize = "1.9"

[features]
default = ["ashpd-async-io"]
ashpd-async-io = ["ashpd/async-io"]
ashpd-tokio = ["ashpd/tokio"]

[lints.rust]
unsafe_code = "deny"
