[package]
name = "discord-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Свой updater: подписанный манифест Ed25519, staged-замена, откат (P8-01)"

[dependencies]
discord-json = { workspace = true }
ring = { version = "0.17", default-features = false, features = ["alloc", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
