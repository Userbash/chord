[package]
name = "discord-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui = { package = "gpui-pre", version = "0.3.12" }
gpui-kit = { path = "../../gpui-kit/crates/kit" }
gpui-component = { path = "../../gpui-kit/crates/component" }
gpui-webview = { path = "../../gpui-kit/crates/webview" }

discord-core = { path = "../crates/discord-core" }
discord-codec = { path = "../crates/discord-codec" }
discord-json = { path = "../crates/discord-json" }
discord-voice = { path = "../crates/discord-voice" }
discord-media = { path = "../crates/discord-media" }
discord-platform = { path = "../crates/discord-platform" }
discord-store = { path = "../crates/discord-store" }
discord-i18n = { path = "../crates/discord-i18n" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Проверенные стандартные библиотеки для замены самописного кода
rusqlite = { version = "0.40.2", features = ["bundled"] }
cpal = "0.15.3"
aes-gcm = "0.11.1"
chacha20poly1305 = "0.11.0"

[profile.release]
lto = "thin"
strip = true

