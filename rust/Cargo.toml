# Chord & Discord protocol client native Rust workspace (P0/P1 phases of docs/rust-client/PLAN.md).
# External dependencies: ruzstd 0.9.1 (pure Rust) and gateway transport:
# tokio/tokio-tungstenite (WS), rustls with ring provider, webpki-roots, futures-util;
# dev dependency `zstd` (C encoder) used only for test stubs. Tests run offline (`cargo test --offline`).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
discord-json = { path = "crates/discord-json" }
discord-codec = { path = "crates/discord-codec" }
discord-core = { path = "crates/discord-core" }
discord-voice = { path = "crates/discord-voice" }
discord-store = { path = "crates/discord-store" }
discord-i18n = { path = "crates/discord-i18n" }
discord-platform = { path = "crates/discord-platform" }
discord-media = { path = "crates/discord-media" }
discord-ui = { path = "crates/discord-ui" }
discord-updater = { path = "crates/discord-updater" }
discord-perf = { path = "crates/discord-perf" }
discord-conformance = { path = "crates/discord-conformance" }
# Gateway transport. Initial versions from specs, exact locked in Cargo.lock.
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# TLS provider ring (not aws-lc-rs: no cmake/nasm dependency), tls12 retained for compatibility.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# HTTP/1.1 transport for REST API: TLS over tokio.
# Versions locked in Cargo.lock / offline cache.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
httparse = "1"
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# zstd encoder — only for test stubs (production reader uses pure Rust ruzstd).
zstd = "0.14"
