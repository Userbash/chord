[package]
name = "chord-client"
version = "0.1.0"
edition = "2021"
description = "Chord: open-source chat and voice client (Tauri UI spike — chat 100k, emoji picker, settings, members 24k)"
publish = false

# Спайк живёт отдельно от основного workspace: тяжёлые GUI-крейты не попадают
# в Cargo.lock продукта, пока ADR-1 не зафиксирует метрики и решение.
[workspace]

# Чистая логика (parse/validate без Tauri-рантайма) — отдельным lib-таргетом,
# чтобы интеграционные тесты проверяли IPC-контракт без запуска окна.
[lib]
name = "chord_client"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# W39j: пилот «BFF через ядро». Только path-зависимость из этого же репозитория:
# внешних крейтов не добавляем, но `discord-core` тянет свой штатный набор
# (tokio/rustls/… ) — он уже в Cargo.lock и кэше registry, сеть не нужна.
chord-core = { path = "../crates/chord-core" }
chord-codec = { path = "../crates/chord-codec" }
chord-json = { path = "../crates/chord-json" }
chord-voice = { path = "../crates/chord-voice" }
chord-store = { path = "../crates/chord-store" }
chord-i18n = { path = "../crates/chord-i18n" }
chord-media = { path = "../crates/chord-media" }
chord-ui = { path = "../crates/chord-ui" }
chord-updater = { path = "../crates/chord-updater" }
# RW-39/NET-C2: keyring (`org.freedesktop.secrets` через libsecret) — только path-dep.
# `Keyring` там `!Send`, поэтому backend держит его в потоке-владельце.
chord-platform = { path = "../crates/chord-platform" }
thiserror = "2"
# Проверка токена — `ApiClient::get` из ядра; tokio уже в графе (tauri/discord-core),
# поэтому офлайн-сборке новая версия не нужна.
tokio = { version = "1", features = ["rt", "time", "net"] }
nix = { version = "0.29", features = ["signal"], default-features = false }
# XDG Desktop Portal (PipeWire screen capture on Wayland) — locally cached 0.13.13
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
enumflags2 = "0.7"

[profile.dev]
debug = 1

[profile.test]
debug = 1

