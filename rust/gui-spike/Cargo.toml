[package]
name = "discord-gui-spike"
version = "0.1.0"
edition = "2021"
description = "P0-01: спайк UI-оболочки Tauri (чат 100k, эмодзи-пикер, настройки, участники 24k)"
publish = false

# Спайк живёт отдельно от основного workspace: тяжёлые GUI-крейты не попадают
# в Cargo.lock продукта, пока ADR-1 не зафиксирует метрики и решение.
[workspace]

# Чистая логика (parse/validate без Tauri-рантайма) — отдельным lib-таргетом,
# чтобы интеграционные тесты проверяли IPC-контракт без запуска окна.
[lib]
name = "discord_gui_spike"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# W39j: пилот «BFF через ядро». Только path-зависимость из этого же репозитория:
# внешних крейтов не добавляем, но `discord-core` тянет свой штатный набор
# (tokio/rustls/… ) — он уже в Cargo.lock и кэше registry, сеть не нужна.
discord-core = { path = "../crates/discord-core" }
discord-codec = { path = "../crates/discord-codec" }
discord-json = { path = "../crates/discord-json" }
discord-voice = { path = "../crates/discord-voice" }
discord-store = { path = "../crates/discord-store" }
discord-i18n = { path = "../crates/discord-i18n" }
discord-media = { path = "../crates/discord-media" }
discord-ui = { path = "../crates/discord-ui" }
discord-updater = { path = "../crates/discord-updater" }
# RW-39/NET-C2: keyring (`org.freedesktop.secrets` через libsecret) — только path-dep.
# `Keyring` там `!Send`, поэтому backend держит его в потоке-владельце.
discord-platform = { path = "../crates/discord-platform" }
thiserror = "2"
# Проверка токена — `ApiClient::get` из ядра; tokio уже в графе (tauri/discord-core),
# поэтому офлайн-сборке новая версия не нужна.
tokio = { version = "1", features = ["rt", "time", "net"] }
nix = { version = "0.29", features = ["signal"], default-features = false }
