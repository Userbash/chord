  <text x="267" y="36" fill="#f23f43" font-size="16" text-anchor="middle" font-family="sans-serif">📞✕</text>
  
  <line x1="16" y1="58" x2="284" y2="58" stroke="#35373c" stroke-width="1"/>

  <!-- Voice Control Buttons: Video, Screen Share, Mute, Deafen -->
