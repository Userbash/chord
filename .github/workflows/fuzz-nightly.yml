name: Nightly Protocol & DAVE v1 Fuzzing

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Iterations per fuzz target (libFuzzer -runs)"
        required: false
        default: "1000000"
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-fuzz-asan:
    name: cargo-fuzz + AddressSanitizer (5 targets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust nightly with sanitizers
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Cache Cargo & cargo-fuzz
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('rust/fuzz/Cargo.lock', 'rust/Cargo.lock') }}
          restore-keys: |
            fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz if not cached
        run: |
          command -v cargo-fuzz >/dev/null 2>&1 || cargo install cargo-fuzz --locked

      - name: Verify crash report generator unit tests
        run: node --test tests/unit/fuzz-report.test.mjs

      - name: Run 5 fuzz targets under AddressSanitizer & LeakSanitizer
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          bash scripts/fuzz-ci.sh --runs "${{ inputs.runs || '1000000' }}"

      - name: Upload fuzzing report, logs, and crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nightly-report-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .gate/fuzz-report.json
            .gate/fuzz-report.md
            .gate/fuzz-logs/*.log
            rust/fuzz/artifacts/**
