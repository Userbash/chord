name: Tauri native builds

on:
  pull_request:
  push:
    branches: [release/developer-alpha-preview, docs/task-20261115-library-modernization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_TARGET_DIR: target/tauri-native

jobs:
  tauri:
    name: Tauri (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            node_arch: x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            node_arch: arm64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            node_arch: x64
            triplet: x64-windows
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            node_arch: arm64
            triplet: arm64-windows
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            node_arch: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            node_arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: ${{ matrix.node_arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ matrix.target }}
          workspaces: rust/gui-spike -> ../../target/tauri-native

      - name: Record native build environment
        env:
          EXPECTED_ARCH: ${{ matrix.node_arch }}
        run: |
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error(`Expected native ${process.env.EXPECTED_ARCH}, got ${process.arch}`); console.log({platform:process.platform, arch:process.arch})'
          rustc --version --verbose
          rustc --print cfg --target "${{ matrix.target }}"

      - name: Linux Tauri libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config libsqlite3-dev libhunspell-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libglib2.0-dev libsecret-1-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            libasound2-dev libpipewire-0.3-dev libenchant-2-dev

      - name: macOS Tauri libraries
        if: matrix.platform == 'macos'
        run: |
          xcodebuild -version
          xcrun --find clang
          brew install hunspell sqlite glib libsecret pkg-config
          tauriRustFlags="${RUSTFLAGS:-}"
          for formula in hunspell sqlite glib libsecret; do
            tauriRustFlags="$tauriRustFlags -L native=$(brew --prefix "$formula")/lib"
          done
          printf 'RUSTFLAGS=%s\n' "$tauriRustFlags" >> "$GITHUB_ENV"
          printf 'PKG_CONFIG_PATH=%s/lib/pkgconfig:%s/lib/pkgconfig:%s\n' "$(brew --prefix glib)" "$(brew --prefix libsecret)" "${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Windows Tauri libraries
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAURI_VCPKG_TRIPLET: ${{ matrix.triplet }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'The native vcpkg installation is required' }
          $triplet = $env:TAURI_VCPKG_TRIPLET
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "sqlite3:$triplet" "hunspell:$triplet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tauriNativePrefix = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/$triplet"
          "LIB=$tauriNativePrefix/lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_NATIVE_DLL_DIR=$tauriNativePrefix/bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$tauriNativePrefix/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Tauri release compilation
        id: tauri_build
        run: |
          cargo build --locked --release --manifest-path rust/gui-spike/Cargo.toml \
            --target "${{ matrix.target }}" --features tauri/custom-protocol

      - name: Tauri contracts
        if: ${{ !cancelled() && steps.tauri_build.outcome == 'success' }}
        run: |
          cargo test --locked --manifest-path rust/gui-spike/Cargo.toml \
            --target "${{ matrix.target }}" --features tauri/custom-protocol --lib --tests

      - name: Stage compiled binary and provenance
        id: tauri_artifact
        if: ${{ !cancelled() && steps.tauri_build.outcome == 'success' }}
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import { copyFileSync, existsSync, mkdirSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';
          const target = process.env.TAURI_TARGET;
          const directory = join('artifacts', `tauri-${target}`);
          mkdirSync(directory, { recursive: true });
          const filename = process.platform === 'win32' ? 'chord-client.exe' : 'chord-client';
          copyFileSync(join(process.env.CARGO_TARGET_DIR, target, 'release', filename), join(directory, filename));
          if (process.platform === 'win32') {
            const nativeDirectory = process.env.TAURI_NATIVE_DLL_DIR;
            if (!nativeDirectory || !existsSync(nativeDirectory)) throw new Error('Native DLL directory is missing');
            for (const name of readdirSync(nativeDirectory).filter(name => name.toLowerCase().endsWith('.dll'))) {
              copyFileSync(join(nativeDirectory, name), join(directory, name));
            }
          }
          const SHA256 = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const files = Object.fromEntries(readdirSync(directory).map(name => [name, SHA256(join(directory, name))]));
          const provenance = { target, source_commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            build_host: { platform: process.platform, arch: process.arch },
            compiler: execFileSync('rustc', ['--version', '--verbose'], { encoding: 'utf8' }),
            cargo_lock_sha256: SHA256('rust/gui-spike/Cargo.lock'), files, native_runtime_qualified: false };
          writeFileSync(join(directory, 'provenance.json'), JSON.stringify(provenance, null, 2) + '\n');
          writeFileSync(join(directory, 'SHA256SUMS'), Object.entries(files).map(([name, hash]) => `${hash}  ${name}\n`).join(''));
          JS

      - name: Upload Tauri build artifact
        if: ${{ !cancelled() && steps.tauri_artifact.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: tauri-${{ matrix.target }}
          path: artifacts/tauri-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
