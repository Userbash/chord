# Auto-merge safe PRs — triggers when all gate checks are green
# Only applies to: dependencies (Dependabot), documentation, non-code configs
# Does NOT apply to: production Rust code, shared coordinator files

name: Auto Merge Safe PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["AI Collab Gate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Dependabot PRs: auto-merge when CI is green
  # ─────────────────────────────────────────────────────────────
  auto-merge-dependabot:
    name: "Auto-merge Dependabot"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    steps:
      - name: Approve Dependabot PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Docs-only PRs: auto-merge when only .md files are changed
  # ─────────────────────────────────────────────────────────────
  auto-merge-docs:
    name: "Auto-merge Docs-only"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docs-only') && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify only docs changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          NON_DOCS=$(git diff --name-only "$BASE" "$HEAD" | grep -vE "\.(md|txt|rst)$" || true)
          if [ -n "$NON_DOCS" ]; then
            echo "::error::Non-docs files changed, cannot auto-merge:"
            echo "$NON_DOCS"
            exit 1
          fi
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
