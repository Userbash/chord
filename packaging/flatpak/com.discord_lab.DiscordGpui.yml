# Flatpak manifest for the native Discord GPUI client (TASK-962)
# RE Oracle: /home/user/clean-room-oracle/native-re.md (§2.1–2.2, $XDG_RUNTIME_DIR/pipewire-0, ScreenCast)
# RE Oracle: /home/user/clean-room-oracle/main-arch.md (@143136, FLATPAK_ID runtime environment)
# Keyring Oracle: rust/crates/chord-platform/src/keyring.rs (org.freedesktop.secrets / Secret portal)
app-id: com.discord_lab.DiscordGpui
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
command: discord-gpui
separate-locales: false

finish-args:
  # Display stack: native Wayland (primary) + safe X11 fallback (only when Wayland is absent)
  - --socket=wayland
  - --socket=fallback-x11
  # Shared memory IPC for X11 MIT-SHM fallback (XShmGetImage)
  - --share=ipc
  # GPU hardware acceleration (WGPU Vulkan / OpenGL 120 FPS + VA-API) without full device access
  - --device=dri
  # Network stack: Discord Gateway (WSS), REST API v9 (HTTPS), and WebRTC media transport (UDP/SRTP/DAVE MLS)
  - --share=network
  # Low-latency screen capture (DMA-BUF NV12) and audio routing via PipeWire socket
  - --filesystem=xdg-run/pipewire-0
  # Audio output compatibility via PipeWire-Pulse / PulseAudio bridge
  - --socket=pulseaudio
  # Session token storage in system keyring via Secret Service API and XDG Secret Portal
  - --talk-name=org.freedesktop.secrets
  # Integration with XDG Desktop Portal (ScreenCast, Secret, FileChooser, Settings)
  - --talk-name=org.freedesktop.portal.Desktop
  # Desktop system notifications
  - --talk-name=org.freedesktop.Notifications
  # System tray icon via StatusNotifierItem (SNI / AppIndicator) protocol
  - --talk-name=org.kde.StatusNotifierWatcher
  # AT-SPI accessibility tree export (WCAG 2.2 AA / Screen Reader)
  - --talk-name=org.a11y.Bus
  # Structured logging by default (with automatic masking of mfa.[REDACTED] tokens)
  - --env=RUST_LOG=info

modules:
  - name: discord-gpui
    buildsystem: simple
    build-commands:
      - install -Dm755 discord-gpui /app/bin/discord-gpui
      - install -Dm644 sbom.spdx.json /app/share/doc/discord-gpui/sbom.spdx.json
      - install -Dm644 LICENSE-MIT /app/share/licenses/com.discord_lab.DiscordGpui/LICENSE-MIT
      - install -Dm644 LICENSE-APACHE /app/share/licenses/com.discord_lab.DiscordGpui/LICENSE-APACHE
      - install -Dm644 BETA-TESTING-GUIDE.md /app/share/doc/discord-gpui/BETA-TESTING-GUIDE.md
      - install -Dm644 RELEASE-NOTES-v1.0.0-beta.1.md /app/share/doc/discord-gpui/RELEASE-NOTES-v1.0.0-beta.1.md
    sources:
      - type: archive
        path: ../../rust/dist/discord-gpui-v1.0.0-beta.1-linux-x86_64.tar.gz
        sha256: 18a6aa8066ce0b6722c8b83a61bf0c43939d5cee7696c7cd6d282ac1167a349e
        only-arches:
          - x86_64
      - type: file
        path: ../../rust/dist/discord-gpui
        sha256: d5e50180d2b0a6edd8faa9c2ad908d931cecb8c5765190bff25be90c7e0e002e
        only-arches:
          - x86_64
      - type: file
        path: ../../rust/dist/sbom.spdx.json
        sha256: acb867f70bd6b4891a274388677363fbb9a521213234bbf384c14f9806de2921
