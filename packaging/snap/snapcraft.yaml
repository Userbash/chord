# Snapcraft package specification for the native Discord GPUI client (TASK-967)
# RE Oracle: /home/user/clean-room-oracle/main-arch.md (#62457 @143136, SNAP / SNAP_NAME -> runtimeEnvironment = "snap")
# RE Oracle: /home/user/clean-room-oracle/native-re.md (§2.1–2.2, $XDG_RUNTIME_DIR/pipewire-0, XDG ScreenCast Portal)
# Keyring Oracle: rust/crates/chord-platform/src/keyring.rs (org.freedesktop.secrets via password-manager-service)
name: discord-gpui
base: core22
version: "1.0.0-beta.1"
summary: "Native Linux Discord client in Rust GPUI (WGPU 120 FPS, Wayland, DAVE v1)"
description: |
  High-performance native Discord client for Linux built with Rust GPUI and WGPU
  (120 FPS hardware rendering, memory budget VmRSS < 60 MB, cold start < 500 ms).
  Supports DAVE MLS v1 (RFC 9420) end-to-end voice and video encryption,
  screen capture via XDG Desktop Portal / PipeWire DMA-BUF, and secure storage of
  session tokens in the Secret Service keyring under a strict AppArmor sandbox.
grade: stable
confinement: strict
compression: lzo
license: MIT OR Apache-2.0

architectures:
  - build-on: [amd64]
    build-for: [amd64]

apps:
  discord-gpui:
    command: bin/discord-gpui
    desktop: usr/share/applications/discord-gpui.desktop
    environment:
      RUST_LOG: info
      DISABLE_WAYLAND: "0"
    plugs:
      # Native Wayland compositor (primary display protocol)
      - wayland
      # Desktop integration, XDG Desktop Portal (ScreenCast, FileChooser, Notifications) and AT-SPI
      - desktop
      # StatusNotifierItem (SNI) system tray and legacy menus support
      - desktop-legacy
      # Safe X11 fallback socket when running in an Xorg session
      - x11
      # GPU hardware acceleration (WGPU Vulkan / OpenGL 120 FPS and VA-API hardware codec)
      - opengl
      # Audio playback via PipeWire / PulseAudio
      - audio-playback
      # Microphone capture for voice channels and Stage rooms
      - audio-record
      # Access to system keyring org.freedesktop.secrets (GNOME Keyring / KWallet)
      - password-manager-service
      # Client network stack: Discord Gateway (WSS), REST API v9 (HTTPS)
      - network
      # Local UDP socket binding for WebRTC ICE / SRTP media transport
      - network-bind
      # Screen blanking inhibition while watching or broadcasting video streams
      - screen-inhibit-control
      # Power status reading for adaptive renderer power saving
      - upower-observe

parts:
  discord-gpui:
    plugin: dump
    source: ../../rust/dist/discord-gpui-v1.0.0-beta.1-linux-x86_64.tar.gz
    source-type: tar
    source-checksum: sha256/18a6aa8066ce0b6722c8b83a61bf0c43939d5cee7696c7cd6d282ac1167a349e
    override-build: |
      craftctl default
      install -Dm755 "$CRAFT_PART_SRC/discord-gpui" "$CRAFT_PART_INSTALL/bin/discord-gpui"
      install -Dm644 "$CRAFT_PART_SRC/LICENSE-MIT" "$CRAFT_PART_INSTALL/usr/share/doc/discord-gpui/LICENSE-MIT"
      install -Dm644 "$CRAFT_PART_SRC/LICENSE-APACHE" "$CRAFT_PART_INSTALL/usr/share/doc/discord-gpui/LICENSE-APACHE"
      install -Dm644 "$CRAFT_PART_SRC/BETA-TESTING-GUIDE.md" "$CRAFT_PART_INSTALL/usr/share/doc/discord-gpui/BETA-TESTING-GUIDE.md"
      install -Dm644 "$CRAFT_PART_SRC/RELEASE-NOTES-v1.0.0-beta.1.md" "$CRAFT_PART_INSTALL/usr/share/doc/discord-gpui/RELEASE-NOTES-v1.0.0-beta.1.md"

  sbom:
    plugin: dump
    source: ../../rust/dist/sbom.spdx.json
    source-type: file
    source-checksum: sha256/acb867f70bd6b4891a274388677363fbb9a521213234bbf384c14f9806de2921
    organize:
      sbom.spdx.json: usr/share/doc/discord-gpui/sbom.spdx.json
