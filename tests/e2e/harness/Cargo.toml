[package]
name = "chord-gpui-e2e-harness"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "chord_gpui_e2e_harness"
path = "runner.rs"

[dependencies]
# FIX-15: Крейты переименованы discord-* → chord-*
chord-core  = { path = "../../../rust/crates/chord-core" }
chord-codec = { path = "../../../rust/crates/chord-codec" }
chord-json  = { path = "../../../rust/crates/chord-json" }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"

[lints.rust]
unsafe_code = "forbid"
