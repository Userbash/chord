[package]
name = "discord-gpui-e2e-harness"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "discord_gpui_e2e_harness"
path = "runner.rs"

[dependencies]
discord-core = { path = "../../../rust/crates/discord-core" }
discord-codec = { path = "../../../rust/crates/discord-codec" }
discord-json = { path = "../../../rust/crates/discord-json" }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"

[lints.rust]
unsafe_code = "forbid"
