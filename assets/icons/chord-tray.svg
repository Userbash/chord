<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Monochrome tray icon: white bars on transparent background, works on dark/light panels -->
  <!-- 5 bars, baseline at y=26, bar width=4px, gap=1px
       total=5*4+4*1=24, starts at x=4
       heights: 12, 7, 15, 6, 18 -->
  <!-- Bar 1 -->
  <rect x="4"  y="14" width="4" height="12" rx="1" fill="white"/>
  <!-- Bar 2 -->
  <rect x="9"  y="19" width="4" height="7"  rx="1" fill="white"/>
  <!-- Bar 3 -->
  <rect x="14" y="11" width="4" height="15" rx="1" fill="white"/>
  <!-- Bar 4 -->
  <rect x="19" y="20" width="4" height="6"  rx="1" fill="white"/>
  <!-- Bar 5 -->
  <rect x="24" y="8"  width="4" height="18" rx="1" fill="white"/>
  <!-- Baseline -->
  <rect x="4"  y="26" width="24" height="1.5" rx="0.75" fill="white" opacity="0.7"/>
</svg>
