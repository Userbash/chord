<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Matte Dark Graphite -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f2b" />
      <stop offset="50%" stop-color="#151620" />
      <stop offset="100%" stop-color="#0c0d14" />
    </linearGradient>

    <!-- Main Crafted Gradient -->
    <linearGradient id="craftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e7bf7" />
      <stop offset="50%" stop-color="#5865f2" />
      <stop offset="100%" stop-color="#3c45be" />
    </linearGradient>

    <!-- Accent Neon Coral / Amber for Voice Energy -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <filter id="subtleGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad3)" filter="url(#shadow3)" />
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#5865f2" stroke-width="2" stroke-opacity="0.35" />

  <!-- Background Acoustic Radial Pattern -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#5865f2" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 6" />

  <!-- Central "Kord / Craft" Emblem: Intersecting Acoustic Polygon & Sound Pod -->
  <g transform="translate(256, 256)">
    <!-- Primary Headset / C-Shape Body -->
    <path d="M 0 -130
             C 75 -130, 135 -70, 135 5
             C 135 60, 105 105, 55 125
             L 35 90
             C 70 75, 95 40, 95 5
             C 95 -45, 55 -90, 0 -90
             C -55 -90, -95 -45, -95 5
             C -95 40, -70 75, -35 90
             L -55 125
             C -105 105, -135 60, -135 5
             C -135 -70, -75 -130, 0 -130 Z"
          fill="url(#craftGrad)"
          filter="url(#subtleGlow3)" />

    <!-- Left Voice Pod / Crystal Node -->
    <rect x="-95" y="0" width="34" height="75" rx="17" fill="url(#energyGrad)" filter="url(#subtleGlow3)" />

    <!-- Right Voice Pod / Crystal Node -->
    <rect x="61" y="0" width="34" height="75" rx="17" fill="url(#energyGrad)" filter="url(#subtleGlow3)" />

    <!-- Center Harmonic Acoustic Wave -->
    <circle cx="0" cy="5" r="18" fill="#ffffff" filter="url(#subtleGlow3)" />
    <path d="M -30 5 L -18 5 M 18 5 L 30 5" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>