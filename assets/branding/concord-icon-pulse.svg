<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Night Blue Obsidian -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141523" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>

    <!-- Wing 1 Gradient: Vivid Blurple -->
    <linearGradient id="wing1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Wing 2 Gradient: Electric Cyan / Turquoise -->
    <linearGradient id="wing2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Center Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad2)" filter="url(#ambientShadow2)" />
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#borderGrad2)" stroke-width="2.5" />

  <!-- Center Ambient Core Glow -->
  <circle cx="256" cy="256" r="120" fill="#6366f1" opacity="0.22" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="70" fill="#22d3ee" opacity="0.18" filter="url(#softGlow)" />

  <!-- Geometric Interlocked Sonic Emblem (Sound Waves forming 'C') -->
  <g transform="translate(256, 256)">
    <!-- Outer Sonic Arc -->
    <path d="M 60 -120
             A 140 140 0 1 0 60 120
             L 30 90
             A 100 100 0 1 1 30 -90
             Z"
          fill="url(#wing1)"
          filter="url(#softGlow)" />

    <!-- Inner Harmonic Pulse Loop -->
    <path d="M 30 -70
             A 80 80 0 1 0 30 70
             L 10 45
             A 50 50 0 1 1 10 -45
             Z"
          fill="url(#wing2)" />

    <!-- Three Dynamic Voice Frequency Bars / Audio Beams inside the opening -->
    <rect x="70" y="-80" width="16" height="50" rx="8" fill="url(#pulseGrad)" />
    <rect x="105" y="-105" width="16" height="100" rx="8" fill="url(#pulseGrad)" filter="url(#softGlow)" />
    <rect x="140" y="-60" width="16" height="60" rx="8" fill="url(#pulseGrad)" />
    
    <rect x="70" y="30" width="16" height="50" rx="8" fill="url(#pulseGrad)" />
    <rect x="105" y="5" width="16" height="100" rx="8" fill="url(#pulseGrad)" filter="url(#softGlow)" />
    <rect x="140" y="0" width="16" height="60" rx="8" fill="url(#pulseGrad)" />
    
    <!-- Central Sound Core Dot -->
    <circle cx="-10" cy="0" r="14" fill="#ffffff" filter="url(#softGlow)" />
  </g>
</svg>